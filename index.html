<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="GMAT Quant">
<title>GMAT Quant Flash</title>
<style>
  :root {
    --bg: #f5f5f7; --card: #ffffff; --ink: #111111; --muted: #86868b;
    --green: #1a9e4b; --green-soft: #e8f5ec; --red: #d64545; --red-soft: #fdecec;
    --border: #e4e4e6; --bar-bg: #ececef; --tag-bg: #ececf0; --tag-fg: #55555a;
    --overlay: rgba(0,0,0,.35); --radius: 14px;
  }
  :root[data-theme="dark"] {
    --bg: #171719; --card: #242426; --ink: #f2f2f4; --muted: #9c9ca1;
    --green: #33c66a; --green-soft: #1c3326; --red: #e05b5b; --red-soft: #382425;
    --border: #3c3c40; --bar-bg: #333336; --tag-bg: #333336; --tag-fg: #b8b8bd;
    --overlay: rgba(0,0,0,.6);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
    background: var(--bg); color: var(--ink);
    display: flex; flex-direction: column; min-height: 100dvh;
  }
  header {
    padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
    background: var(--card); border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 10;
  }
  .toprow { display: flex; align-items: center; gap: 10px; }
  .bar { flex: 1; height: 5px; background: var(--bar-bg); border-radius: 3px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--green); border-radius: 3px; transition: width .3s; }
  .progress-num { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .gear { border: none; background: none; cursor: pointer; color: var(--muted); padding: 4px; display: flex; }
  .gear svg { width: 20px; height: 20px; }

  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 20px; }
  .card { width: 100%; max-width: 560px; }
  .en {
    font-size: clamp(28px, 7vw, 42px); font-weight: 700; letter-spacing: -.02em;
    text-align: center; line-height: 1.25;
  }
  .example {
    margin-top: 16px; text-align: center; color: var(--muted);
    font-size: clamp(14px, 3.8vw, 17px); line-height: 1.55; font-style: italic;
  }
  .example b { color: var(--ink); font-style: normal; }
  .latex {
    margin-top: 6px; font-size: clamp(26px, 7vw, 40px); font-weight: 700;
    letter-spacing: .01em; text-align: center; line-height: 1.4;
    font-family: "Times New Roman", Georgia, serif; font-style: italic;
  }
  .latex .frac { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; margin: 0 3px; }
  .latex .frac > span:first-child { border-bottom: 2px solid currentColor; padding: 0 6px; }
  .latex .frac > span:last-child { padding: 0 6px; }
  .latex .sqrt-in { text-decoration: overline; }
  .latex sup, .latex sub { font-size: .62em; }
  .formula-en { margin-top: 12px; text-align: center; color: var(--muted); font-size: clamp(14px, 3.8vw, 17px); font-weight: 600; }
  .cat-tag {
    display: inline-block; margin-top: 14px; font-size: 11px; color: var(--tag-fg);
    background: var(--tag-bg); padding: 2px 10px; border-radius: 999px;
  }

  .options { margin-top: 28px; display: grid; grid-template-columns: 1fr; gap: 12px; }
  .opt {
    border: 1.5px solid var(--border); background: var(--card); border-radius: var(--radius);
    padding: 14px 22px; font-size: clamp(16px, 4.5vw, 20px); font-weight: 600;
    cursor: pointer; transition: transform .08s, border-color .12s, background .12s;
    text-align: left; color: var(--ink); width: 100%;
    display: flex; flex-direction: column; gap: 3px; align-items: flex-start;
  }
  .opt-en { font-size: 13px; font-weight: 500; color: var(--muted); }
  .opt.correct .opt-en { color: var(--green); font-weight: 600; }
  .opt.wrong .opt-en { color: var(--red); font-weight: 600; }
  .opt:active { transform: scale(.98); }
  .opt.correct { border-color: var(--green); background: var(--green-soft); animation: pop .3s; box-shadow: 0 0 0 5px rgba(26,158,75,.14); }
  .opt.wrong { border-color: var(--red); background: var(--red-soft); animation: shake .3s; }
  @keyframes pop { 40% { transform: scale(1.05); } }
  @keyframes shake { 20% { transform: translateX(-5px); } 45% { transform: translateX(5px); } 70% { transform: translateX(-3px); } }

  /* 题目切换过渡：新题上浮淡入 + 高斯模糊消散 */
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(14px); filter: blur(6px); }
    to   { opacity: 1; transform: translateY(0);    filter: blur(0); }
  }
  .quiz-anim { animation: cardIn .32s cubic-bezier(.2, .7, .3, 1); }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  #doneWrap:not([hidden]) { animation: cardIn .4s cubic-bezier(.2, .7, .3, 1); }

  .feedback {
    margin-top: 20px; min-height: 44px; display: flex; flex-direction: column; gap: 8px;
    align-items: center; text-align: center;
  }
  .fb-hint { font-size: 15px; color: var(--muted); line-height: 1.55; animation: fadeIn .35s; }
  .fb-hint b { color: var(--ink); }
  .fb-hint svg { width: 16px; height: 16px; vertical-align: -2px; }
  .fb-ok svg { color: var(--green); }
  .fb-no svg { color: var(--red); }
  .streak {
    display: flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600;
    color: var(--red); animation: fadeIn .4s;
  }
  .streak svg { width: 14px; height: 14px; }

  /* 答对庆祝徽章：中央弹出，0.9s 生命周期与自动下一题对齐 */
  .celebration {
    position: fixed; inset: 0; z-index: 100; pointer-events: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; opacity: 0; transition: opacity .12s;
  }
  .celebration.play { opacity: 1; }
  .cele-icon {
    width: 92px; height: 92px; border-radius: 50%; background: var(--green); color: #fff;
    display: flex; align-items: center; justify-content: center; opacity: 0;
    box-shadow: 0 10px 44px rgba(26,158,75,.5);
  }
  .cele-icon svg { width: 50px; height: 50px; }
  .celebration.play .cele-icon { animation: celeFull .9s cubic-bezier(.2, 1.2, .3, 1) forwards; }
  @keyframes celeFull {
    0%   { transform: scale(.2); opacity: 0; }
    28%  { transform: scale(1.14); opacity: 1; }
    42%  { transform: scale(.96); }
    55%  { transform: scale(1); opacity: 1; }
    82%  { opacity: 1; }
    100% { transform: scale(1.06); opacity: 0; }
  }
  .cele-streak {
    display: flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 700;
    color: var(--red); opacity: 0;
  }
  .cele-streak svg { width: 20px; height: 20px; }
  .celebration.play .cele-streak { animation: celeStreakFade .9s forwards; }
  @keyframes celeStreakFade {
    0% { opacity: 0; transform: translateY(8px); }
    30% { opacity: 1; transform: none; }
    80% { opacity: 1; }
    100% { opacity: 0; }
  }
  .btn {
    border: none; background: var(--ink); color: var(--bg); font-size: 16px; font-weight: 600;
    padding: 13px 44px; border-radius: 999px; cursor: pointer; margin-top: 10px;
  }
  .btn:active { transform: scale(.97); }

  .done-wrap { text-align: center; padding: 40px 20px; }
  .done-wrap h2 { font-size: 24px; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .done-wrap h2 svg { width: 28px; height: 28px; color: var(--green); }
  .done-wrap p { margin-top: 12px; color: var(--muted); line-height: 1.7; }

  #settings {
    position: fixed; inset: 0; background: var(--overlay); z-index: 50;
    display: none; align-items: flex-end; justify-content: center;
  }
  #settings.open { display: flex; }
  #settings.open .sheet { animation: sheetUp .28s cubic-bezier(.2, .7, .3, 1); }
  @keyframes sheetUp { from { transform: translateY(60px); opacity: .3; } to { transform: none; opacity: 1; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .sheet {
    background: var(--card); width: 100%; max-width: 560px;
    border-radius: 20px 20px 0 0; padding: 22px 20px calc(24px + env(safe-area-inset-bottom));
  }
  .sheet h3 { font-size: 17px; margin-bottom: 14px; }
  .sheet h4 { font-size: 14px; color: var(--muted); margin: 16px 0 10px; font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .chip {
    border: 1.5px solid var(--border); background: var(--card); border-radius: 999px;
    padding: 8px 14px; font-size: 14px; cursor: pointer; color: var(--ink);
  }
  .chip.on { border-color: var(--ink); background: var(--ink); color: var(--bg); font-weight: 600; }
  .sheet .row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-top: 1px solid var(--border); font-size: 15px; }
  .sheet .row .val { color: var(--muted); font-size: 13px; }
  .danger { color: var(--red); background: none; border: none; font-size: 15px; cursor: pointer; padding: 0; }

  /* 尊重系统减弱动效设置 */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<header>
  <div class="toprow">
    <div class="bar"><div id="barFill" style="width:0%"></div></div>
    <span class="progress-num" id="progressNum">0 / 0</span>
    <button class="gear" id="gearBtn" aria-label="设置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button>
  </div>
</header>

<main id="main">
  <div class="card" id="quiz" hidden>
    <div style="text-align:center">
      <div class="en" id="en"></div>
      <div class="example" id="example"></div>
      <span class="cat-tag" id="catTag"></span>
    </div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
  </div>

  <div class="done-wrap" id="doneWrap" hidden>
    <h2 id="doneTitle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>今日队列刷完</h2>
    <p id="doneDesc"></p>
    <button class="btn" id="againBtn">再刷一轮错词</button>
  </div>

  <div class="celebration" id="celebration">
    <div class="cele-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
    <div class="cele-streak" id="celeStreak"></div>
  </div>
</main>

<div id="settings">
  <div class="sheet">
    <h3>设置</h3>
    <div class="chips" id="catChips"></div>
    <h4>外观</h4>
    <div class="chips" id="themeChips"></div>
    <div class="row"><span>词库掌握度</span><span class="val" id="masteryVal">—</span></div>
    <div class="row"><span>今日已刷</span><span class="val" id="todayVal">—</span></div>
    <div class="row" style="border-bottom:1px solid var(--border)"><span>进度数据</span><button class="danger" id="resetBtn">重置全部进度</button></div>
  </div>
</div>

<script src="words.js"></script>
<script>
"use strict";
const LS_KEY = "gqf_state_v1";
const THEME_KEY = "gqf_theme";
const BOX_DAYS = { 1: 1, 2: 3, 3: 7 };   // box → 间隔天数；box 4 = 掌握
const DAY = 86400000;
const ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
const ICON_X = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>';
const ICON_FLAME = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>';

// ---------- 主题（默认跟随系统） ----------
let themeMode = localStorage.getItem(THEME_KEY) || "auto";
const mqDark = (typeof window !== "undefined" && window.matchMedia) ? window.matchMedia("(prefers-color-scheme: dark)") : null;
function applyTheme() {
  let eff = themeMode;
  if (eff === "auto") eff = (mqDark && mqDark.matches) ? "dark" : "light";
  document.documentElement.dataset.theme = eff;
}
applyTheme();
if (mqDark && mqDark.addEventListener) {
  mqDark.addEventListener("change", () => { if (themeMode === "auto") applyTheme(); });
}
function renderThemeChips() {
  const box = document.getElementById("themeChips");
  box.innerHTML = "";
  for (const [key, name] of [["auto", "跟随系统"], ["light", "浅色"], ["dark", "深色"]]) {
    const c = document.createElement("button");
    c.className = "chip" + (themeMode === key ? " on" : "");
    c.textContent = name;
    c.onclick = () => {
      themeMode = key;
      localStorage.setItem(THEME_KEY, key);
      applyTheme();
      renderThemeChips();
    };
    box.appendChild(c);
  }
}

// ---------- 轻量 LaTeX 渲染（GMAT 公式子集，零依赖） ----------
const LATEX_SYMBOLS = {
  "\\pi": "π", "\\pm": "±", "\\times": "×", "\\div": "÷", "\\cdot": "·",
  "\\le": "≤", "\\ge": "≥", "\\ne": "≠", "\\approx": "≈", "\\infty": "∞",
  "\\theta": "θ", "\\Delta": "Δ", "\\cup": "∪", "\\cap": "∩", "\\bar{x}": "x̄",
  "\\bar{v}": "v̄", "\\%": "%",
};
function renderLatex(src) {
  let s = String(src).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  // 先 \sqrt（参数无嵌套），再 \frac——避免 sqrt 的花括号干扰 frac 的参数匹配
  s = s.replace(/\\sqrt\{([^{}]*)\}/g, '√<span class="sqrt-in">$1</span>');
  s = s.replace(/\\frac\{([^{}]*)\}\{([^{}]*)\}/g, '<span class="frac"><span>$1</span><span>$2</span></span>');
  // 符号映射
  for (const [k, v] of Object.entries(LATEX_SYMBOLS)) s = s.split(k).join(v);
  // 上下标：^{...} 与 _{...}
  s = s.replace(/\^\{([^}]*)\}/g, "<sup>$1</sup>").replace(/_\{([^}]*)\}/g, "<sub>$1</sub>");
  // 单字符上下标（不含括号捕获，避免吃进后续字符）
  s = s.replace(/\^([0-9])/g, "<sup>$1</sup>").replace(/_([0-9a-z])/g, "<sub>$1</sub>");
  return s;
}

// ---------- 状态 ----------
function todayStr() { const d = new Date(); return d.getFullYear() + "-" + (d.getMonth()+1) + "-" + d.getDate(); }
function defaultState() {
  return { box: {}, last: {}, wrongToday: {}, doneToday: 0, date: todayStr(), cats: ["number","algebra","geometry","stats","prob","word"] };
}
let state = (() => {
  try {
    const s = JSON.parse(localStorage.getItem(LS_KEY) || "null");
    if (!s) return defaultState();
    if (s.date !== todayStr()) { s.wrongToday = {}; s.doneToday = 0; s.date = todayStr(); }
    if (!s.cats || !s.cats.length) s.cats = Object.keys(CATEGORIES);
    return s;
  } catch { return defaultState(); }
})();
function save() { localStorage.setItem(LS_KEY, JSON.stringify(state)); }

// ---------- 队列 ----------
let queue = [];      // 词库索引
let current = null;  // 当前词条索引
let opts = [];       // 当前选项
let answered = false;
let sessionWrong = []; // 本轮答错的词
let streak = 0;         // 连对计数（会话级，退出清零）

function daysSince(last) { return Math.floor((Date.now() - new Date(last).getTime()) / DAY); }
function buildQueue() {
  const now = todayStr();
  const groups = {};
  for (const c of state.cats) groups[c] = [];
  for (let i = 0; i < WORDS.length; i++) {
    if (!state.cats.includes(WORDS[i].cat)) continue;
    const b = state.box[i] || 0;
    if (b === 4) continue;                          // 已掌握
    if (b === 0) { groups[WORDS[i].cat].push(i); continue; }  // 新词 / 未掌握
    const dueDays = BOX_DAYS[b] || 7;
    if (daysSince(state.last[i] || now) >= dueDays) groups[WORDS[i].cat].push(i);  // 到期复习
  }
  // 今日错词加练：组首、组尾各一次，洗牌后自然分开
  for (const i of Object.keys(state.wrongToday)) {
    const idx = Number(i);
    if (state.box[idx] === 4 || !state.cats.includes(WORDS[idx].cat)) continue;
    groups[WORDS[idx].cat].unshift(idx);
    groups[WORDS[idx].cat].push(idx);
  }
  // 组内洗牌，组间洗牌：同专题连续出题，专题之间随机
  const cats = state.cats.filter(c => groups[c].length).sort(() => Math.random() - .5);
  const q = [];
  for (const c of cats) {
    const g = groups[c];
    for (let i = g.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [g[i], g[j]] = [g[j], g[i]];
    }
    q.push(...g);
  }
  queue = q;
  sessionWrong = [];
  updateProgress();
}

function updateProgress() {
  const total = queue.length + (current !== null && !queue.includes(current) ? 0 : 0);
  const left = queue.length;
  const done = Math.max(0, state.doneToday);
  document.getElementById("progressNum").textContent = done + " / " + (done + left);
  const pct = done + left === 0 ? 100 : Math.round(done / (done + left) * 100);
  document.getElementById("barFill").style.width = pct + "%";
}

function nextQuestion() {
  if (!queue.length) { showDone(); return; }
  current = queue.shift();
  answered = false;
  opts = buildOptions(current);
  const qz = document.getElementById("quiz");
  qz.classList.remove("quiz-anim");
  void qz.offsetWidth;   // 强制 reflow，重启动画
  qz.classList.add("quiz-anim");
  const w = WORDS[current];
  const enEl = document.getElementById("en");
  const ex = document.getElementById("example");
  if (w.latex) {
    enEl.innerHTML = `<div class="latex">${renderLatex(w.latex)}</div><div class="formula-en">${w.en}</div>`;
    ex.innerHTML = "";
  } else {
    enEl.textContent = w.en;
    ex.innerHTML = highlightEn(w.example, w.en);
  }
  document.getElementById("catTag").textContent = CATEGORIES[w.cat];
  const box = document.getElementById("options");
  box.innerHTML = "";
  opts.forEach((o, k) => {
    const b = document.createElement("button");
    b.className = "opt";
    b.textContent = o.cn;
    b.onclick = () => answer(k, b);
    box.appendChild(b);
  });
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("quiz").hidden = false;
  document.getElementById("doneWrap").hidden = true;
  updateProgress();
}

function buildOptions(idx) {
  const correct = WORDS[idx];
  const pool = WORDS.map((w, i) => ({ cn: w.cn, en: w.en, i }))
    .filter(w => w.i !== idx && w.cn !== correct.cn && state.cats.includes(WORDS[w.i].cat));
  const picked = [];
  while (picked.length < 3 && pool.length) {
    const k = Math.floor(Math.random() * pool.length);
    picked.push(pool.splice(k, 1)[0]);
  }
  const out = [{ cn: correct.cn, en: correct.en, ok: true }, ...picked.map(p => ({ cn: p.cn, en: p.en, ok: false }))];
  for (let i = out.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
}

// 例句里高亮概念词（取 en 去掉 (verb) 等说明后的核心）
function highlightEn(example, en) {
  const core = en.replace(/\s*\(.*?\)\s*/g, "").trim();
  const esc = core.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const re = new RegExp("(" + esc.split(" ").map(w => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("[^A-Za-z0-9]*") + ")", "gi");
  return example.replace(re, "<b>$1</b>");
}

function celebrate(n) {
  const c = document.getElementById("celebration");
  document.getElementById("celeStreak").innerHTML = n >= 2 ? `${ICON_FLAME} 连对 ${n} 题` : "";
  c.classList.remove("play");
  void c.offsetWidth;
  c.classList.add("play");
  setTimeout(() => c.classList.remove("play"), 950);
}

function answer(k, btnEl) {
  if (answered) return;
  answered = true;
  const w = WORDS[current];
  const fb = document.getElementById("feedback");
  const btns = document.querySelectorAll(".opt");
  btns.forEach(b => { b.style.pointerEvents = "none"; });
  // 作答后：四个选项全部展示「中文 + 对应英文」配对
  btns.forEach((b, i) => {
    b.innerHTML = `<span>${opts[i].cn}</span><span class="opt-en">${opts[i].en}</span>`;
  });

  if (opts[k].ok) {
    btnEl.classList.add("correct");
    streak++;
    celebrate(streak);
    // 答对：进下一级 box
    const b = state.box[current] || 0;
    state.box[current] = Math.min(4, b + 1);
    state.last[current] = todayStr();
    delete state.wrongToday[current];
    state.doneToday++;
    fb.innerHTML = `<div class="fb-hint fb-ok">${ICON_CHECK}<b>${w.cn}</b> — ${w.hint}</div><button class="btn" id="contBtn">继续</button>`;
    document.getElementById("contBtn").onclick = () => nextQuestion();
    updateProgress();
    save();
  } else {
    streak = 0;
    btnEl.classList.add("wrong");
    const correctBtn = [...btns].find((b, i) => opts[i].ok);
    if (correctBtn) correctBtn.classList.add("correct");
    // 答错：退回 box 0，当日重练
    state.box[current] = 0;
    state.wrongToday[current] = (state.wrongToday[current] || 0) + 1;
    state.doneToday++;
    save();
    sessionWrong.push(current);
    queue.push(current);  // 当日重现
    fb.innerHTML = `<div class="fb-hint fb-no">${ICON_X} 正确：<b>${w.cn}</b><br>${w.hint}</div><button class="btn" id="contBtn">继续</button>`;
    document.getElementById("contBtn").onclick = () => nextQuestion();
    updateProgress();
  }
}

function showDone() {
  document.getElementById("quiz").hidden = true;
  document.getElementById("doneWrap").hidden = false;
  const mastered = Object.values(state.box).filter(b => b === 4).length;
  const total = WORDS.filter(w => state.cats.includes(w.cat)).length;
  const wrongN = sessionWrong.length;
  document.getElementById("doneDesc").innerHTML =
    `本轮答错 ${wrongN} 个（已重新排进队列）<br>掌握度：${mastered} / ${total}` +
    (wrongN === 0 && mastered === total ? "<br>全部掌握，去刷真题吧！" : "");
  updateProgress();
}

// ---------- 设置 ----------
function renderChips() {
  const box = document.getElementById("catChips");
  box.innerHTML = "";
  for (const [key, name] of Object.entries(CATEGORIES)) {
    const c = document.createElement("button");
    c.className = "chip" + (state.cats.includes(key) ? " on" : "");
    c.textContent = name;
    c.onclick = () => {
      if (state.cats.includes(key)) {
        if (state.cats.length === 1) return;
        state.cats = state.cats.filter(x => x !== key);
      } else state.cats.push(key);
      save(); renderChips(); renderStats(); buildQueue();
      if (current === null || !queue.length) nextQuestion();
    };
    box.appendChild(c);
  }
}
function renderStats() {
  const inCats = WORDS.filter(w => state.cats.includes(w.cat)).length;
  const mastered = Object.values(state.box).filter(b => b === 4).length;
  document.getElementById("masteryVal").textContent = mastered + " / " + inCats;
  document.getElementById("todayVal").textContent = String(state.doneToday);
}

document.getElementById("gearBtn").onclick = () => document.getElementById("settings").classList.add("open");
document.getElementById("settings").onclick = e => { if (e.target.id === "settings") e.target.classList.remove("open"); };
document.getElementById("resetBtn").onclick = () => {
  if (confirm("确认重置全部刷题进度？词库本身不受影响。")) {
    state = defaultState(); save(); renderChips(); renderStats(); buildQueue(); nextQuestion();
    document.getElementById("settings").classList.remove("open");
  }
};
document.getElementById("againBtn").onclick = () => {
  // 错词重练：把今日错词再排一轮
  const again = sessionWrong.length ? sessionWrong : Object.keys(state.wrongToday).map(Number);
  queue = [...new Set(again)];
  if (!queue.length) { buildQueue(); }
  nextQuestion();
};

// ---------- 启动 ----------
renderThemeChips();
renderChips();
renderStats();
buildQueue();
nextQuestion();
</script>
